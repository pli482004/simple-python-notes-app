platform: python                # requirements.txt and FastAPI app (backend/app.py) indicate a Python web app
platformVersion: "3.14"      # build.yaml snippet in README.md specifies Python 3.14

run:
  port: 8080                   # README's build.yaml snippet sets port 8080
  # startCommand omitted to let Oryx generate the appropriate startup (application.py is the WSGI entrypoint)

static:
  directories:
    - static                   # repository contains a static/ directory and backend serves index.html from it
  spaFallback: true            # app serves index.html at / (SPA frontend) so fallback is useful

healthCheck:
  enabled: true                # backend.app defines /api/health
  path: "/api/health"        # use the backend health endpoint to verify the app process
  expectedStatusCode: 200      # /api/health returns 200 when healthy

# Heads-up: Only the latest commit on 'main' was scanned; review this config before deploying.
