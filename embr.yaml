platform: python                # requirements.txt and backend/app.py (FastAPI) indicate a Python app
platformVersion: "3.14"     # build.yaml shown in README.md lists python 3.14

run:
  port: 8080                  # README's build.yaml sets port 8080; app listens on /api and should use 8080
  routePrefixes:
    - /api                    # backend routes are under /api in backend/app.py; keep API routing to the container

static:
  directories:
    - static                   # repo has a top-level static/ with index.html and favicon.svg used by the app
  spaFallback: true            # frontend is a single-page app (index.html) — serve index.html for non-/api routes

healthCheck:
  path: "/api/health"        # backend exposes /api/health in backend/app.py
  expectedStatusCode: 200      # that endpoint returns 200 when healthy


# Heads-up: Only the latest commit on branch 'hello' was scanned. Review this config before deploying.
